<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feliz cumpleaños mi amor ❤️</title>

<style>
body{
background: linear-gradient(135deg,#ff6fa5,#ffb6c1);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
overflow:hidden;
margin:0;
}

.contenedor{
text-align:center;
color:white;
padding:20px;
}

h1{
font-size:3em;
animation:latido 1.5s infinite;
}

button{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:30px;
cursor:pointer;
}

@keyframes latido{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="contenedor">
<h1>feliz cumpleaños amira ❤️</h1>

<p>hay algo muy especial esperándote...</p>

<button onclick="mostrarMensaje()">
abrir sorpresa
</button>
</div>

<script>
function mostrarMensaje(){
alert("feliz cumpleaños mi amor ❤️ gracias por llegar a mi vida");
}
</script>

</body>
</html>
